# Give GNOME up to 15 s (default 5 s) to lock the screen before suspend. On 2026-11-20 a busy gnome-shell missed
# the 5 s limit: the system slept unlocked, the lid was opened during entry and the display took ~20 s to return.
# Locking normally finishes within 1 s, so suspend entry is not slower in the usual case.
[Login]
InhibitDelayMaxSec=15
