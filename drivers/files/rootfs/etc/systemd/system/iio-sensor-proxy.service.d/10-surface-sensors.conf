# Read the Surface Laptop 7 light sensor through the patched libssc, after the
# sensor service when both start together. Ordering only: iio-sensor-proxy
# never waits for a sensor service that cannot start.
[Unit]
ConditionFirmware=device-tree-compatible(microsoft,romulus13)
After=surface-sensors.service

[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/surface-sensors
Restart=always
RestartSec=2
TimeoutStopSec=10s
