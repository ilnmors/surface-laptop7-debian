# Surface Laptop 7 speakers: the Windows speaker tuning as a PipeWire filter chain.
#
# Generated by dolby2pipewire.py from the Dolby DAX3 tuning for AUCD\VEN_QCOM&DEV_0C29&SUBSYS_MSHW0462&REV_0A
# (tuning version 6, profile "music").
# Chain: speaker EQ -> gain -> crossover -> a limiter per band -> mix -> output limiter.
#
# The limiter is the speaker protection. Its bass ceilings come from the
# Windows regulator; everything above the bass bands may reach
# -0.6 dBFS. The gain in front of it (+3.5 dB) is the Windows volume
# maximizer. Lowering the gain is always safe; raising a ceiling is not.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    # A broken chain must not take PipeWire down with it.
    flags = [ nofail ]
    args = {
      node.description = "Surface speakers (Windows EQ)"
      media.name = "Surface speakers (Windows EQ)"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          {
            type = builtin  name = eq  label = param_eq
            config = {
              filters1 = [
                { type = bq_lowshelf freq = 81 gain = -9.04 q = 0.707 }
                { type = bq_peaking freq = 141 gain = 3.67 q = 1.41 }
                { type = bq_peaking freq = 234 gain = 3.97 q = 2.45 }
                { type = bq_peaking freq = 328 gain = 1.12 q = 2.85 }
                { type = bq_peaking freq = 469 gain = -0.9 q = 2.89 }
                { type = bq_peaking freq = 656 gain = -3.76 q = 3.46 }
                { type = bq_peaking freq = 844 gain = -0.68 q = 4.47 }
                { type = bq_peaking freq = 1031 gain = -1.13 q = 4.47 }
                { type = bq_peaking freq = 1313 gain = -0.83 q = 4.04 }
                { type = bq_peaking freq = 1688 gain = -3.87 q = 3.67 }
                { type = bq_peaking freq = 2250 gain = 0.78 q = 3.47 }
                { type = bq_peaking freq = 3000 gain = 0.44 q = 3.97 }
                { type = bq_peaking freq = 3750 gain = -2.14 q = 4.47 }
                { type = bq_peaking freq = 4688 gain = 0.47 q = 4.56 }
                { type = bq_peaking freq = 5813 gain = -1.47 q = 4.78 }
                { type = bq_peaking freq = 7125 gain = 1.72 q = 4.53 }
                { type = bq_peaking freq = 9000 gain = 3.79 q = 4.38 }
                { type = bq_peaking freq = 11250 gain = -0.14 q = 4.63 }
                { type = bq_peaking freq = 13875 gain = 1.92 q = 3.44 }
                { type = bq_highshelf freq = 16528 gain = -0.05 q = 0.707 }
              ]
              filters2 = [
                { type = bq_lowshelf freq = 81 gain = -8.87 q = 0.707 }
                { type = bq_peaking freq = 141 gain = 4.38 q = 1.41 }
                { type = bq_peaking freq = 234 gain = 4.32 q = 2.45 }
                { type = bq_peaking freq = 328 gain = 2.41 q = 2.85 }
                { type = bq_peaking freq = 469 gain = 2.01 q = 2.89 }
                { type = bq_peaking freq = 656 gain = -4.65 q = 3.46 }
                { type = bq_peaking freq = 844 gain = 0.05 q = 4.47 }
                { type = bq_peaking freq = 1031 gain = -0.76 q = 4.47 }
                { type = bq_peaking freq = 1313 gain = 0.67 q = 4.04 }
                { type = bq_peaking freq = 1688 gain = -1.94 q = 3.67 }
                { type = bq_peaking freq = 2250 gain = -0.7 q = 3.47 }
                { type = bq_peaking freq = 3000 gain = 0.39 q = 3.97 }
                { type = bq_peaking freq = 3750 gain = -1.07 q = 4.47 }
                { type = bq_peaking freq = 4688 gain = 0.14 q = 4.56 }
                { type = bq_peaking freq = 5813 gain = -0.08 q = 4.78 }
                { type = bq_peaking freq = 7125 gain = -0.52 q = 4.53 }
                { type = bq_peaking freq = 9000 gain = 2.32 q = 4.38 }
                { type = bq_peaking freq = 11250 gain = 5.07 q = 4.63 }
                { type = bq_peaking freq = 13875 gain = 4.59 q = 3.44 }
                { type = bq_highshelf freq = 16528 gain = -0.12 q = 0.707 }
              ]
            }
          }
          { type = builtin  name = gain_l  label = linear
            control = { Mult = 1.4962 Add = 0.0 } }
          { type = builtin  name = gain_r  label = linear
            control = { Mult = 1.4962 Add = 0.0 } }
          {
            type = lv2  name = xover  plugin = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
            control = {
              enabled = 1  mode = 0
              sf_1 = 182  frs_1 = 5
              sf_2 = 277  frs_2 = 5
              sf_3 = 744  frs_3 = 5
              sf_4 = 933  frs_4 = 5
              sf_5 = 1163  frs_5 = 5
              frs_6 = 0
              frs_7 = 0
            }
          }
          # Band 1, 141 Hz bands: ceiling -9.0 dB (Windows softens from -21.0 dB).
          { type = lv2  name = lim1  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.3548  lk = 10.0  at = 5.0  rt = 20.0 } }
          # Band 2, 234 Hz bands: ceiling -16.5 dB (Windows softens from -28.5 dB).
          { type = lv2  name = lim2  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.1496  lk = 10.0  at = 5.0  rt = 20.0 } }
          # Band 3, 328 Hz and 469 Hz and 656 Hz bands: ceiling -31.0 dB (Windows softens from -43.0 dB).
          { type = lv2  name = lim3  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.0282  lk = 10.0  at = 5.0  rt = 5.0 } }
          # Band 4, 844 Hz bands: ceiling -29.6 dB (Windows softens from -41.6 dB).
          { type = lv2  name = lim4  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.0330  lk = 10.0  at = 5.0  rt = 5.0 } }
          # Band 5, 1031 Hz bands: ceiling -20.4 dB (Windows softens from -32.4 dB).
          { type = lv2  name = lim5  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.0958  lk = 10.0  at = 5.0  rt = 5.0 } }
          # Band 6, everything above: ceiling -3.4 dB (Windows softens from -15.4 dB).
          { type = lv2  name = lim6  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.6780  lk = 10.0  at = 5.0  rt = 5.0 } }
          { type = builtin  name = mix_l  label = mixer  control = { "Gain 1" = 1.0  "Gain 2" = 1.0  "Gain 3" = 1.0  "Gain 4" = 1.0  "Gain 5" = 1.0  "Gain 6" = 1.0 } }
          { type = builtin  name = mix_r  label = mixer  control = { "Gain 1" = 1.0  "Gain 2" = 1.0  "Gain 3" = 1.0  "Gain 4" = 1.0  "Gain 5" = 1.0  "Gain 6" = 1.0 } }
          # Output limiter at -0.6 dBFS for the summed bands.
          { type = lv2  name = limout  plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = { enabled = 1  ovs = 0  boost = 0  alr = 0  knee = 1.0  th = 0.9306  lk = 5.0  at = 5.0  rt = 5.0 } }
        ]
        links = [
          { output = "eq:Out 1" input = "gain_l:In" }
          { output = "eq:Out 2" input = "gain_r:In" }
          { output = "gain_l:Out" input = "xover:in_l" }
          { output = "gain_r:Out" input = "xover:in_r" }
          { output = "xover:band0l" input = "lim1:in_l" }
          { output = "xover:band0r" input = "lim1:in_r" }
          { output = "lim1:out_l" input = "mix_l:In 1" }
          { output = "lim1:out_r" input = "mix_r:In 1" }
          { output = "xover:band1l" input = "lim2:in_l" }
          { output = "xover:band1r" input = "lim2:in_r" }
          { output = "lim2:out_l" input = "mix_l:In 2" }
          { output = "lim2:out_r" input = "mix_r:In 2" }
          { output = "xover:band2l" input = "lim3:in_l" }
          { output = "xover:band2r" input = "lim3:in_r" }
          { output = "lim3:out_l" input = "mix_l:In 3" }
          { output = "lim3:out_r" input = "mix_r:In 3" }
          { output = "xover:band3l" input = "lim4:in_l" }
          { output = "xover:band3r" input = "lim4:in_r" }
          { output = "lim4:out_l" input = "mix_l:In 4" }
          { output = "lim4:out_r" input = "mix_r:In 4" }
          { output = "xover:band4l" input = "lim5:in_l" }
          { output = "xover:band4r" input = "lim5:in_r" }
          { output = "lim5:out_l" input = "mix_l:In 5" }
          { output = "lim5:out_r" input = "mix_r:In 5" }
          { output = "xover:band5l" input = "lim6:in_l" }
          { output = "xover:band5r" input = "lim6:in_r" }
          { output = "lim6:out_l" input = "mix_l:In 6" }
          { output = "lim6:out_r" input = "mix_r:In 6" }
          { output = "mix_l:Out" input = "limout:in_l" }
          { output = "mix_r:Out" input = "limout:in_r" }
        ]
        inputs = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "limout:out_l" "limout:out_r" ]
      }
      capture.props = {
        node.name = "surface_laptop_7_speakers"
        node.description = "Surface speakers (Windows EQ)"
        media.class = Audio/Sink
        priority.session = 1001
        priority.driver = 1001
        device.icon-name = "audio-speakers"
      }
      playback.props = {
        node.name = "surface_laptop_7_speakers.output"
        # Internal, like the hidden speaker sink it feeds, so sound
        # settings list neither; only the chain's sink is shown.
        media.class = "Stream/Output/Audio"
        target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.passive = true
        # Wait for the speaker sink; never fall back to the default sink,
        # which is this chain itself. At boot the sink appears seconds
        # after this chain (the sound card probes late); without linger
        # WirePlumber destroys the chain when the target is missing.
        node.dont-fallback = true
        node.linger = true
        stream.dont-remix = true
      }
    }
  }
]
